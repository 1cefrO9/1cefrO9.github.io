<div id="giscus"></div>
<script>
  // 主题获取逻辑（兼容首次访问无localStorage的情况）
  const getTheme = () => {
    const storedTheme = localStorage.getItem("pref-theme");
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    return storedTheme || systemTheme;
  };

  // 主题切换逻辑
  const setGiscusTheme = () => {
    const theme = getTheme();
    const message = {
      giscus: {
        setConfig: {
          theme: theme === 'dark' ? 'dark' : 'light' // 根据你的主题名调整
        }
      }
    };

    const iframe = document.querySelector('iframe.giscus-frame');
    iframe?.contentWindow.postMessage(message, 'https://giscus.app');
  };

  // 动态加载giscus
  const initGiscus = () => {
    const giscus = document.createElement('script');
    
    // 配置参数（从Hugo配置中获取）
    const config = {
      src: 'https://giscus.app/client.js',
      'data-repo': 'sonnycalcr/sonnycalcr.github.io',
      'data-repo-id': 'R_kgDOMed_Fg',
      'data-category': 'Announcements',
      'data-category-id': 'DIC_kwDOMed_Fs4ChXJF',
      'data-mapping': 'pathname',
      'data-strict': '0',
      'data-reactions-enabled': '1',
      'data-emit-metadata': '0',
      'data-input-position': 'bottom',
      'data-theme': getTheme() === 'dark' ? 'dark' : 'light', // 初始主题
      'data-lang': 'zh-CN',
      crossorigin: 'anonymous',
      async: true
    };

    Object.entries(config).forEach(([key, value]) => {
      giscus.setAttribute(key, value);
    });

    // 监听主题切换事件
    window.addEventListener('message', (event) => {
      if (event.origin !== 'https://giscus.app') return;
      if (event.data.giscus?.loading === false) {
        setGiscusTheme(); // 初始化时设置主题
      }
    });

    document.getElementById('giscus').appendChild(giscus);
  };

  // 初始化
  document.addEventListener('DOMContentLoaded', initGiscus);

  // 监听主题切换按钮（需要与你的主题切换逻辑配合）
  const themeToggle = document.querySelector('[data-theme-toggle]');
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      setTimeout(setGiscusTheme, 100); // 等待主题切换完成
    });
  }

  // 监听系统主题变化
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setGiscusTheme);
</script>
